<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Aluno — Advanced English</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #10203D;
    --navy-soft: #1B3358;
    --steel: #7C8CA6;
    --steel-light: #C7D0DD;
    --accent: #3E7BFA;
    --accent-warm: #FF6F5E;
    --paper: #FBFCFE;
    --paper-dim: #F1F4F9;
    --ink: #10203D;
    --gold: #E8B84B;

    --font-display: 'Poppins', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
  }

  a { text-decoration: none; color: inherit; }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }

  header {
    position: sticky;
    top: 0; z-index: 100;
    background: rgba(251, 252, 254, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(16, 32, 61, 0.08);
  }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0;
  }

  .logo-img { height: 38px; width: auto; display: block; }

  .back-link {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--navy-soft);
  }

  .login-section {
    min-height: calc(100vh - 76px);
    display: flex; align-items: center; justify-content: center;
    background: var(--navy);
    color: var(--paper);
    padding: 60px 24px;
  }

  .login-card {
    width: 100%; max-width: 360px;
    background: rgba(251,252,254,0.06);
    border: 1px solid rgba(251,252,254,0.14);
    border-radius: 20px;
    padding: 40px 34px;
  }

  .login-card .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px; text-align: center;
  }

  .login-card h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; }
  .login-card p.sub { color: var(--steel-light); font-size: 0.9rem; text-align: center; margin-bottom: 30px; }

  .field-group { margin-bottom: 18px; }
  .field-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--steel-light); }
  .field-group input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid rgba(251,252,254,0.2);
    background: rgba(251,252,254,0.05); color: var(--paper);
    font-family: var(--font-body); font-size: 0.94rem;
  }
  .field-group input:focus { outline: none; border-color: var(--accent); }
  .field-group input::placeholder { color: var(--steel-light); opacity: 0.6; }

  .login-submit {
    width: 100%; padding: 14px; margin-top: 8px;
    border: none; border-radius: 100px;
    background: var(--accent); color: var(--navy);
    font-weight: 700; font-size: 0.95rem; cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .login-submit:hover { background: var(--accent-warm); transform: translateY(-1px); }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html"><img src="assets/logo.png" alt="Advanced English" class="logo-img"></a>
    <a href="index.html" class="back-link">Voltar ao site</a>
  </div>
</header>

<section class="login-section">
  <div class="login-card">
    <div class="eyebrow">Área do Aluno</div>
    <h1>Acesse sua conta</h1>
    <p class="sub">Entre com seu login e senha para acessar o conteúdo.</p>
    <form id="loginForm">
      <div class="field-group">
        <label for="login">Login</label>
        <input type="text" id="login" placeholder="Usuário ou e-mail" required>
      </div>
      <div class="field-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" required>
      </div>
      <button type="submit" class="login-submit">Entrar</button>
    </form>
  </div>
</section>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Login em breve! A Área do Aluno ainda está sendo configurada.');
  });
</script>

</html>
