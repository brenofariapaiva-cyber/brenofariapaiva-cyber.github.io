<style>
  :root {
    --navy: #10203D;
    --navy-soft: #1B3358;
    --steel: #7C8CA6;
    --steel-light: #C7D0DD;
    --accent: #3E7BFA;
    --accent-warm: #FF6F5E;
    --paper: #FBFCFE;
    --paper-dim: #F1F4F9;
    --ink: #10203D;
    --gold: #E8B84B;

    --font-display: 'Poppins', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
  }

  a { text-decoration: none; color: inherit; }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }

  header {
    position: sticky;
    top: 0; z-index: 100;
    background: rgba(251, 252, 254, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(16, 32, 61, 0.08);
  }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0;
  }

  .logo-img { height: 38px; width: auto; display: block; }

  .back-link {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--navy-soft);
  }

  .login-section {
    min-height: calc(100vh - 76px);
    display: flex; align-items: center; justify-content: center;
    background: var(--navy);
    color: var(--paper);
    padding: 60px 24px;
  }

  .login-card {
    width: 100%; max-width: 380px;
    background: rgba(251,252,254,0.06);
    border: 1px solid rgba(251,252,254,0.14);
    border-radius: 20px;
    padding: 40px 34px;
  }

  .login-card .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px; text-align: center;
  }

  .login-card h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; }
  .login-card p.sub { color: var(--steel-light); font-size: 0.9rem; text-align: center; margin-bottom: 30px; }

  .field-group { margin-bottom: 18px; }
  .field-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--steel-light); }
  .field-group input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid rgba(251,252,254,0.2);
    background: rgba(251,252,254,0.05); color: var(--paper);
    font-family: var(--font-body); font-size: 0.94rem;
  }
  .field-group input:focus { outline: none; border-color: var(--accent); }
  .field-group input::placeholder { color: var(--steel-light); opacity: 0.6; }
  .field-group .hint { font-size: 0.76rem; color: var(--steel-light); margin-top: 5px; }

  .login-submit {
    width: 100%; padding: 14px; margin-top: 8px;
    border: none; border-radius: 100px;
    background: var(--accent); color: var(--navy);
    font-weight: 700; font-size: 0.95rem; cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .login-submit:hover { background: var(--accent-warm); transform: translateY(-1px); }
  .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-msg { font-size: 0.85rem; text-align: center; margin-top: 16px; display: none; }
  .login-msg.show { display: block; }
  .login-msg.error { color: var(--accent-warm); }
  .login-msg.ok { color: #4ADE80; }

  .login-footer { text-align: center; margin-top: 22px; font-size: 0.85rem; color: var(--steel-light); }
  .login-footer a { color: var(--accent); font-weight: 600; }

  .success-box { display: none; text-align: center; }
  .success-box.show { display: block; }
  .success-box .icon { font-size: 2.4rem; margin-bottom: 14px; }
  .success-box p { color: var(--steel-light); font-size: 0.92rem; margin-bottom: 22px; }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html"><img src="assets/logo.png" alt="Advanced English" class="logo-img"></a>
    <a href="index.html" class="back-link">Voltar ao site</a>
  </div>
</header>

<section class="login-section">
  <div class="login-card">
    <div id="formBox">
      <div class="eyebrow">Área do Aluno</div>
      <h1>Criar sua conta</h1>
      <p class="sub">Use o mesmo e-mail da sua compra do Curso Gravado.</p>
      <form id="signupForm">
        <div class="field-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="voce@email.com" required>
        </div>
        <div class="field-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Crie uma senha" minlength="6" required>
          <div class="hint">Mínimo de 6 caracteres.</div>
        </div>
        <button type="submit" class="login-submit" id="signupBtn">Criar conta</button>
        <div class="login-msg" id="signupMsg"></div>
      </form>
      <div class="login-footer">Já tem conta? <a href="area-do-aluno.html">Entrar</a></div>
    </div>

    <div class="success-box" id="successBox">
      <div class="icon">✅</div>
      <h1>Conta criada!</h1>
      <p>Assim que confirmarmos sua compra, seu acesso à área de membros será liberado. Isso pode levar até algumas horas.</p>
      <a href="index.html" class="login-submit" style="display:block;">Voltar ao site</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const signupForm = document.getElementById('signupForm');
  const signupBtn = document.getElementById('signupBtn');
  const signupMsg = document.getElementById('signupMsg');

  function showMsg(text, type) {
    signupMsg.textContent = text;
    signupMsg.className = `login-msg show ${type}`;
  }

  signupForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    signupBtn.disabled = true;
    signupBtn.textContent = 'Criando...';
    signupMsg.className = 'login-msg';

    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;

    const { error } = await supabaseClient.auth.signUp({ email, password: senha });

    if (error) {
      signupBtn.disabled = false;
      signupBtn.textContent = 'Criar conta';
      showMsg(error.message.includes('already registered') ? 'Esse e-mail já tem conta cadastrada.' : 'Não deu pra criar a conta. Tente de novo.', 'error');
      return;
    }

    document.getElementById('formBox').style.display = 'none';
    document.getElementById('successBox').classList.add('show');
    if (typeof fbq === 'function') fbq('track', 'CompleteRegistration');
  });
</script>

</body>
</html>
