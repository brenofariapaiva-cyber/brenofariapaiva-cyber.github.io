<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Blog — Advanced English</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1830; --navy-deep: #060E1E; --navy-soft: #1B3358;
    --steel: #7C8CA6; --steel-light: #C7D0DD;
    --accent: #3E7BFA; --accent-warm: #FF6F5E;
    --paper: #FBFCFE; --paper-dim: #F1F4F9; --ink: #10203D;
    --font-display: 'Poppins', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); color: var(--ink); background: var(--paper); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 28px; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }

  header {
    background: rgba(251,252,254,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(16,32,61,0.08); position: sticky; top: 0; z-index: 10;
  }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .logo-img { height: 38px; }
  .back-link { font-size: 0.9rem; font-weight: 600; color: var(--navy-soft); }

  .post-header { padding: 48px 0 28px; }
  .post-cat-tag {
    display: inline-block; font-size: 0.76rem; font-weight: 700;
    color: var(--accent); background: rgba(62,123,250,0.1);
    padding: 5px 13px; border-radius: 100px; margin-bottom: 16px;
  }
  .post-header h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin-bottom: 14px; }
  .post-meta { font-size: 0.88rem; color: var(--steel); }

  .post-cover-img {
    width: 100%; aspect-ratio: 16/9; border-radius: 18px;
    background: linear-gradient(135deg, var(--navy), var(--navy-soft));
    background-size: cover; background-position: center;
    margin-bottom: 36px;
  }

  .post-content { font-size: 1.02rem; color: var(--navy-soft); }
  .post-content p { margin-bottom: 20px; }
  .post-content strong { color: var(--ink); }

  .post-cta {
    background: var(--paper-dim); border: 1px solid rgba(16,32,61,0.08);
    border-radius: 16px; padding: 26px 28px; margin: 40px 0;
  }
  .post-cta p { color: var(--navy-soft); font-size: 0.95rem; margin-bottom: 16px; }
  .post-cta-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .post-cta-btn {
    font-size: 0.86rem; font-weight: 700; padding: 11px 20px; border-radius: 100px;
  }
  .post-cta-btn.primary { background: var(--accent); color: var(--navy-deep); }
  .post-cta-btn.ghost { border: 1.5px solid rgba(16,32,61,0.15); color: var(--navy); }

  .author-box {
    display: flex; align-items: center; gap: 16px;
    background: var(--paper-dim); border-radius: 16px; padding: 22px 24px;
    margin: 36px 0 56px;
  }
  .author-photo {
    width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--navy));
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    color: var(--paper); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
  }
  .author-info strong { display: block; font-size: 0.95rem; }
  .author-info span { font-size: 0.82rem; color: var(--steel); }

  .related-section { padding-bottom: 90px; }
  .related-section h3 { font-size: 1.1rem; margin-bottom: 18px; }
  .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .related-card {
    background: var(--paper-dim); border-radius: 14px; padding: 18px;
    border: 1px solid rgba(16,32,61,0.07);
  }
  .related-card .post-meta { font-size: 0.75rem; margin-bottom: 6px; }
  .related-card h4 { font-size: 0.92rem; font-family: var(--font-display); font-weight: 600; }

  .not-found { padding: 90px 0; text-align: center; }
  .not-found h1 { margin-bottom: 14px; }
  .not-found p { color: var(--steel); margin-bottom: 24px; }

  footer { background: var(--navy-deep); color: var(--steel-light); padding: 28px 0; text-align: center; font-size: 0.85rem; }

  @media (max-width: 640px) {
    .related-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html"><img src="assets/logo.png" alt="Advanced English" class="logo-img"></a>
    <a href="blog.html" class="back-link">Voltar ao blog</a>
  </div>
</header>

<div id="postRoot"></div>

<footer>
  <div class="wrap">© <span id="year"></span> Advanced English</div>
</footer>

<script src="blog-data.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function estimateReadTime(html) {
    const text = html.replace(/<[^>]*>/g, ' ');
    const words = text.trim().split(/\s+/).filter(Boolean).length;
    const minutes = Math.max(1, Math.round(words / 200));
    return `${minutes} min de leitura`;
  }

  function formatDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function initials(name) {
    return name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const post = BLOG_POSTS.find(p => p.slug === slug);
  const root = document.getElementById('postRoot');

  if (!post) {
    root.innerHTML = `
      <div class="wrap not-found">
        <h1>Post não encontrado</h1>
        <p>Esse post não existe ou foi removido.</p>
        <a href="blog.html" class="post-cta-btn primary">Voltar ao blog</a>
      </div>`;
  } else {
    document.getElementById('pageTitle').textContent = `${post.title} — Advanced English`;

    const author = post.author || BLOG_DEFAULT_AUTHOR;

    const related = BLOG_POSTS
      .filter(p => p.category === post.category && p.slug !== post.slug)
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 3);

    root.innerHTML = `
      <div class="wrap post-header">
        <span class="post-cat-tag">${post.category}</span>
        <h1>${post.title}</h1>
        <div class="post-meta">${formatDate(post.date)} · ${estimateReadTime(post.content)}</div>
      </div>

      <div class="wrap">
        <div class="post-cover-img" style="${post.cover ? `background-image:url('${post.cover}')` : ''}"></div>

        <div class="post-content">${post.content}</div>

        <div class="post-cta">
          <p>Quer saber por onde começar? Descubra seu nível de inglês com um plano de estudos personalizado, ou comece com uma aula experimental gratuita.</p>
          <div class="post-cta-actions">
            <a href="nivelamento.html" class="post-cta-btn primary">Fazer o teste de nivelamento</a>
            <a href="index.html#contato" class="post-cta-btn ghost">Aula experimental grátis</a>
          </div>
        </div>

        <div class="author-box">
          <div class="author-photo" style="${author.photo ? `background-image:url('${author.photo}')` : ''}">${author.photo ? '' : initials(author.name)}</div>
          <div class="author-info">
            <strong>${author.name}</strong>
            <span>${author.role}</span>
          </div>
        </div>
      </div>

      ${related.length > 0 ? `
        <div class="wrap related-section">
          <h3>Posts relacionados</h3>
          <div class="related-grid">
            ${related.map(r => `
              <a href="post.html?slug=${encodeURIComponent(r.slug)}" class="related-card">
                <div class="post-meta">${r.category}</div>
                <h4>${r.title}</h4>
              </a>
            `).join('')}
          </div>
        </div>
      ` : ''}
    `;
  }
</script>

</body>
</html>
